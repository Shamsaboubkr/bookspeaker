name: Build Windows MSI

# Builds the Windows installer in GitHub's cloud — nothing to install on your PC.
#
# HOW TO USE
#   1. This file goes in the repo at:  .github/workflows/windows-msi.yml
#   2. It runs by itself on every push. You can also start it by hand:
#      Actions tab -> "Build Windows MSI" -> Run workflow.
#   3. When it finishes, download the .msi from the Artifacts box on the run page.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.24.5'
  APP_NAME: Bookspeaker

jobs:
  windows:
    name: Build Windows app + MSI
    # Pinned deliberately: the 'latest' image moved to a newer Windows Server
    # where Flutter cannot find Visual Studio's C++ tools, which makes it fall
    # back to the VS2019 generator name and fail. windows-2022 is the image
    # with VS2022 + the Desktop C++ workload that Flutter expects.
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------- source
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub uploads files into whatever folder you happen to be viewing, so
      # the bundle often ends up in a subfolder (e.g. .github/workflows/).
      # This looks for it ANYWHERE in the repo and unpacks it to the root, so
      # it does not matter where the upload landed.
      - name: Find and unpack the source bundle
        shell: pwsh
        run: |
          Write-Host "--- files at the repo root ---"
          Get-ChildItem -Force | Select-Object -First 25 Name | Format-Table -HideTableHeaders

          $bundle = Get-ChildItem -Path . -Recurse -File -ErrorAction SilentlyContinue |
                    Where-Object {
                      $_.Name -in @('bookspeaker-src.zip', 'bookspeaker-src.tar.gz') -and
                      $_.FullName -notmatch '\\\.git\\'
                    } | Select-Object -First 1

          if ($bundle) {
            Write-Host "Found bundle: $($bundle.FullName) - unpacking to the repo root"
            if ($bundle.Extension -eq '.zip') {
              Expand-Archive -Path $bundle.FullName -DestinationPath '.' -Force
            } else {
              tar -xzf $bundle.FullName
            }
            Write-Host "unpacked"
          } else {
            Write-Host "No bundle anywhere - assuming the source is already in the repo"
          }

          # Same idea for the installer files: if they were uploaded somewhere
          # odd, copy them to where the build expects them.
          $wxs = Get-ChildItem -Path . -Recurse -File -Filter 'Product.wxs' -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notmatch '\\\.git\\' } | Select-Object -First 1
          if (-not (Test-Path 'windows/installer/Product.wxs') -and $wxs) {
            New-Item -ItemType Directory -Force -Path 'windows/installer' | Out-Null
            Copy-Item $wxs.FullName 'windows/installer/Product.wxs'
            Write-Host "copied Product.wxs -> windows/installer/"
          }

          $ico = Get-ChildItem -Path . -Recurse -File -Filter 'bookspeaker.ico' -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notmatch '\\\.git\\' } | Select-Object -First 1
          if (-not (Test-Path 'windows/installer/bookspeaker.ico') -and $ico) {
            New-Item -ItemType Directory -Force -Path 'windows/installer' | Out-Null
            Copy-Item $ico.FullName 'windows/installer/bookspeaker.ico'
            Write-Host "copied bookspeaker.ico -> windows/installer/"
          }

      - name: Check the project is complete
        shell: pwsh
        run: |
          $need = @(
            'pubspec.yaml',
            'lib/main.dart',
            'windows/CMakeLists.txt',
            'windows/runner/main.cpp',
            'windows/installer/Product.wxs'
          )
          $missing = @($need | Where-Object { -not (Test-Path $_) })
          if ($missing.Count) {
            Write-Host "::error::Still missing: $($missing -join ', ')"
            Write-Host "The source bundle (bookspeaker-src.zip) was not found anywhere in the repo."
            throw "Add bookspeaker-src.zip to the repository (upload it on the main Code page, not inside a folder) and run the workflow again."
          }
          Write-Host "Project looks complete."

      # ---------------------------------------------------------------- tooling
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Windows only allows symlinks (which Flutter needs for plugins) when
      # Developer Mode is on. GitHub's machines have it off, which is exactly
      # why the first build failed. This is what the setting toggles.
      - name: Enable Developer Mode (needed for plugins)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense `
            -PropertyType DWord -Value 1 -Force | Out-Null
          Write-Host "Developer Mode enabled"
          flutter config --enable-windows-desktop
          git config --system core.longpaths true

      - name: Get dependencies
        run: flutter pub get

      - name: Read the version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          $full = $line.Matches[0].Groups[1].Value.Trim()
          $msi  = ($full -split '\+')[0]
          if ($msi -notmatch '^\d+\.\d+\.\d+$') { $msi = "$msi.0" }
          Write-Host "version $full  ->  MSI version $msi"
          "full=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi=$msi"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # -------------------------------------------------- Visual Studio check
      # Flutter builds Windows apps with CMake, which needs Visual Studio's
      # C++ desktop tools. If Flutter cannot find them it silently asks CMake
      # for the *Visual Studio 16 2019* generator instead of 17 2022, and CMake
      # then reports "could not find any instance of Visual Studio".
      - name: Check Visual Studio C++ tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $detected = $false
          if (Test-Path $vswhere) {
            $json = & $vswhere -all -products * -prerelease -format json -utf8 `
                      -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 | ConvertFrom-Json
            foreach ($vs in $json) {
              Write-Host "Visual Studio found: $($vs.displayName)  at $($vs.installationPath)"
              $detected = $true
            }
          } else {
            Write-Host "vswhere.exe not present"
          }
          "VS_DETECTED=$($detected.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "--- what Flutter sees ---"
          flutter doctor -v | Select-String -Pattern 'Visual Studio|cmake|Windows Version' -Context 0,2

      # Only runs if the check above found nothing - costs nothing otherwise.
      - name: Install VS2022 C++ build tools (only if missing)
        if: env.VS_DETECTED != 'true'
        shell: pwsh
        timeout-minutes: 40
        run: |
          Write-Host "No Visual Studio C++ tools found - installing them"
          choco install visualstudio2022buildtools --no-progress -y --package-parameters `
            "--quiet --wait --norestart --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -all -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "done"

      # ---------------------------------------------------------------- build
      # Output is saved to a file so that, if this ever fails, the reason is
      # printed into the run Summary instead of being buried in the log.
      - name: Build the Windows app
        shell: pwsh
        run: |
          flutter build windows --release --no-tree-shake-icons *>&1 |
            Tee-Object -FilePath build-windows.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::flutter build windows failed (exit $code)"
            Add-Content $env:GITHUB_STEP_SUMMARY "`n### Build failed - last 60 lines`n"
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Get-Content build-windows.log -Tail 60 | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            exit $code
          }
          Write-Host "App built:"
          Get-ChildItem 'build\windows\x64\runner\Release' | Select-Object Name, Length

      - name: Zip the app (no-install version)
        shell: pwsh
        run: |
          $src = 'build\windows\x64\runner\Release'
          if (-not (Test-Path $src)) { throw "No build output at $src" }
          $out = "build\${{ env.APP_NAME }}-windows-portable.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $out -Force
          Write-Host "zip: $([math]::Round((Get-Item $out).Length/1MB,1)) MB"

      - name: Upload the portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bookspeaker-windows-portable
          path: build/Bookspeaker-windows-portable.zip
          if-no-files-found: error

      # ---------------------------------------------------------------- the MSI
      # WiX 3.14 binaries come straight from the official release, so there is
      # no package-manager version to get wrong.
      - name: Get WiX 3.14 (the installer builder)
        shell: pwsh
        run: |
          $wix = "$env:RUNNER_TEMP\wix314"
          $zip = "$env:RUNNER_TEMP\wix.zip"
          New-Item -ItemType Directory -Force -Path $wix | Out-Null
          $urls = @(
            'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip',
            'https://github.com/wixtoolset/wix3/releases/download/wix314rtm/wix314-binaries.zip'
          )
          $got = $false
          foreach ($u in $urls) {
            try {
              Write-Host "trying $u"
              Invoke-WebRequest -Uri $u -OutFile $zip -UseBasicParsing
              $got = $true; break
            } catch { Write-Host "  failed: $($_.Exception.Message)" }
          }
          if ($got) {
            Expand-Archive -Path $zip -DestinationPath $wix -Force
            $wix | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            Write-Host "Downloads failed - falling back to the package manager"
            choco install wixtoolset --version=3.14.1 --no-progress -y
            $alt = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
            if (-not (Test-Path "$alt\candle.exe")) { throw "WiX 3.14 is not available" }
            $alt | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          Write-Host "WiX ready:"
          Get-ChildItem ($env:GITHUB_PATH, "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" |
            Where-Object { $_ } | ForEach-Object { $_ } | Select-Object -First 1) -ErrorAction SilentlyContinue
          where.exe heat.exe 2>$null; where.exe candle.exe 2>$null

      - name: Turn the built files into an installer package
        shell: pwsh
        working-directory: windows/installer
        run: |
          # heat.exe lists every file in the build output as an installer component
          # -arch x64 marks the components 64-bit, matching the x64 package.
          heat.exe dir "..\..\build\windows\x64\runner\Release" `
            -cg AppFiles -gg -sfrag -srd -dr INSTALLFOLDER -arch x64 `
            -var var.AppSource -out harvest.wxs *>&1 | Tee-Object -FilePath heat.log
          $code = $LASTEXITCODE
          if ($code -ne 0 -or -not (Test-Path harvest.wxs)) {
            Add-Content $env:GITHUB_STEP_SUMMARY "`n### heat.exe failed`n"
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Get-Content heat.log -Tail 40 | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Write-Host "::error::heat.exe failed (exit $code)"
            exit 1
          }
          Write-Host "packaged $((Select-String -Path harvest.wxs -Pattern '<File ' -AllMatches).Matches.Count) files"

      - name: Build the .msi
        shell: pwsh
        working-directory: windows/installer
        run: |
          $version = '${{ steps.version.outputs.msi }}'
          $full    = '${{ steps.version.outputs.full }}'
          $appdir  = (Resolve-Path '..\..\build\windows\x64\runner\Release').Path
          Write-Host "version=$version  full=$full"
          Write-Host "appdir=$appdir"

          candle.exe -arch x64 "-dVersion=$version" "-dAppSource=$appdir" Product.wxs harvest.wxs *>&1 |
            Tee-Object -FilePath candle.log
          if ($LASTEXITCODE -ne 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "`n### candle.exe failed (compiling the installer definition)`n"
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Get-Content candle.log -Tail 40 | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Write-Host "::error::candle.exe failed"
            exit 1
          }

          light.exe -ext WixUIExtension -cultures:en-us -b "$appdir" `
            -out "${{ env.APP_NAME }}-$full-x64.msi" Product.wixobj harvest.wixobj *>&1 |
            Tee-Object -FilePath light.log
          if ($LASTEXITCODE -ne 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "`n### light.exe failed (linking the .msi)`n"
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Get-Content light.log -Tail 40 | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Write-Host "::error::light.exe failed"
            exit 1
          }

          Get-ChildItem *.msi | Select-Object Name, Length


      - name: Collect the MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/msi | Out-Null
          Copy-Item "windows/installer/*.msi" build/msi/
          Get-ChildItem build/msi

      - name: Upload the MSI
        uses: actions/upload-artifact@v4
        with:
          name: bookspeaker-windows-msi
          path: build/msi/*
          if-no-files-found: error

      # Whatever happens, keep the log so a failure can be read later.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-windows.log
          if-no-files-found: ignore

      - name: What you can download
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "`n## Bookspeaker for Windows`n"
          $found = $false
          Get-ChildItem build/msi -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -eq '.msi' } | ForEach-Object {
              Add-Content $env:GITHUB_STEP_SUMMARY ("* **``" + $_.Name + "``** - " + [math]::Round($_.Length/1MB,1) + " MB")
              $found = $true
            }
          Get-ChildItem build/*.zip -ErrorAction SilentlyContinue | ForEach-Object {
            Add-Content $env:GITHUB_STEP_SUMMARY ("* ``" + $_.Name + "`` - " + [math]::Round($_.Length/1MB,1) + " MB (no-install version)")
            $found = $true
          }
          if (-not $found) {
            Add-Content $env:GITHUB_STEP_SUMMARY "Nothing was produced - read the failed step above."
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "`nFiles are in the **Artifacts** box at the bottom of this page."

  release:
    name: Attach files to a Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
